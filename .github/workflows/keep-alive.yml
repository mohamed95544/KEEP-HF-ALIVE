name: Keep HuggingFace Space Alive

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
  workflow_dispatch:

jobs:
  ping-space:
    runs-on: ubuntu-latest
    steps:
      - name: Wake HuggingFace Space via API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_URL: ${{ secrets.SPACE_URL }}
        run: |
          # Extract the space ID (username/space-name) from the URL
          SPACE_ID=$(echo "$SPACE_URL" | sed -E 's|https://huggingface\.co/spaces/||' | tr -d '/')
          
          echo "Target Space ID: $SPACE_ID"
          
          # Force a wake/restart request using Hugging Face's API with a 15-second timeout so it never hangs
          curl -X POST --max-time 15 \
            "https://huggingface.co/api/spaces/$SPACE_ID/restart" \
            -H "Authorization: Bearer $HF_TOKEN" \
            -H "Content-Type: application/json"
          
          echo "Wake request sent successfully."